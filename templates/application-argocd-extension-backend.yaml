{{- /*
Deploys the Argo CD UI extension backend via the shared `app` chart, following
application-go-healthz.yaml / application-network-exporter.yaml.

Namespace model: argocd-server and PLATFORM Application CRs live in glueops-core,
but TENANT Application CRs -- the ones this serves -- live in $env via
apps-in-any-namespace. The two namespace-coupled sites are the NetworkPolicy
namespaceSelector (where argocd-server runs) and ALLOWED_APP_NAMESPACES (where
Application CRs live). The RBAC below is cluster-scoped and needs no change.
*/ -}}
{{- $env := .Values.captain_domain | splitList "." | first -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glueops-core-argocd-extension-backend
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: "in-cluster"
    namespace: glueops-core-argocd-extension-backend
  project: glueops-core
  syncPolicy:
    syncOptions:
      - Replace=true
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2
      limit: 5
  source:
    repoURL: https://helm.gpkg.io/project-template
    chart: app
    targetRevision: 0.13.0
    helm:
      values: |
        appName: 'argocd-extension-backend-api'
        # Immutable: the app chart feeds appVersion into the Deployment's
        # spec.selector. Changing it fails every sync with "field is immutable"
        # until the Deployment is deleted by hand. The image tag identifies the
        # running version; this is only a label.
        appVersion: '0.0.1'

        image:
          port: 8000
          registry: {{ .Values.container_images.app_argocd_extension_backend.argocd_extension_backend.image.registry | quote }}
          repository: {{ .Values.container_images.app_argocd_extension_backend.argocd_extension_backend.image.repository | quote }}
          tag: {{ .Values.container_images.app_argocd_extension_backend.argocd_extension_backend.image.tag | quote }}

        serviceAccount:
          create: true
          name: argocd-extension-backend-api

        service:
          enabled: true
          port: 8000

        podDisruptionBudget:
          enabled: true
          minAvailable: 1

        deployment:
          {{- toYaml .Values.glueops_node_and_tolerations | nindent 10 }}
          enabled: true
          replicas: 2
          imagePullPolicy: IfNotPresent
          strategy: RollingUpdate
          maxUnavailable: "0"
          maxSurge: 1

          serviceAccount:
            enabled: true
            automountServiceAccountToken: true

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault

          containerSecurityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: argocd-extension-backend-api
                  app.kubernetes.io/instance: glueops-core-argocd-extension-backend

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          volumes:
            - name: tmp
              emptyDir: {}
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          envMap:
            PORT:
              value: "8000"
            LOG_LEVEL:
              value: "INFO"
            REQUEST_TIMEOUT_MS:
              value: "8000"
            TEMPO_SEARCH_PATH:
              value: "/api/search"
            TEMPO_BASE_URL:
              value: ""
            # Thanos, from the OTel monitoring stack. Absent on clusters still on
            # kube-prometheus-stack; tolerated because only the backend's Prometheus
            # proxy route reads it and the UI never calls that route.
            PROMETHEUS_BASE_URL:
              value: "http://glueops-core-thanos-query.glueops-core-monitoring.svc.cluster.local:9090"
            GRAFANA_BASE_URL:
              value: "https://grafana.{{ .Values.captain_domain }}"
            VAULT_BASE_URL:
              value: "https://vault.{{ .Values.captain_domain }}"
            DEPLOYMENT_CONFIG_REPO_URL:
              value: "https://github.com/{{ .Values.gitHub.tenant_github_org }}/deployment-configurations"
            CONFIG_REPO_LOCAL_ROOT:
              value: ""
            GRAFANA_LOGS_DASHBOARD:
              value: ""
            GRAFANA_METRICS_DASHBOARD:
              value: ""
            GRAFANA_TRACES_DASHBOARD:
              value: ""
            GRAFANA_PROMETHEUS_DS_UID:
              value: {{ .Values.argocd_extension_backend.grafana_prometheus_ds_uid | quote }}
            GRAFANA_TEMPO_DS_UID:
              value: {{ .Values.argocd_extension_backend.grafana_tempo_ds_uid | quote }}
            GRAFANA_LOKI_DS_UID:
              value: {{ .Values.argocd_extension_backend.grafana_loki_ds_uid | quote }}
            GRAFANA_APM_DASHBOARD:
              value: {{ .Values.argocd_extension_backend.grafana_apm_dashboard | quote }}
            GRAFANA_K8S_OVERVIEW_DASHBOARD:
              value: {{ .Values.argocd_extension_backend.grafana_k8s_overview_dashboard | quote }}
            GRAFANA_K8S_POD_DASHBOARD:
              value: {{ .Values.argocd_extension_backend.grafana_k8s_pod_dashboard | quote }}
            ALLOWED_APP_NAMESPACES:
              value: "glueops-core,{{ $env }}"
            ALLOWED_DEST_NAMESPACES:
              value: {{ $env | quote }}
            ALLOWED_NAMESPACES:
              value: {{ $env | quote }}
            SUPPORT_URL:
              value: "https://support.glueops.dev"
            DOCUMENTATION_URL:
              value: "https://docs.glueops.dev"
            SKIP_PROJECTS:
              value: "glueops-core"

        customResources:
          # NetworkPolicy: only argocd-server (in glueops-core) may reach the backend.
          - |-
            apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: argocd-extension-backend-api
              namespace: glueops-core-argocd-extension-backend
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: argocd-extension-backend-api
                  app.kubernetes.io/instance: glueops-core-argocd-extension-backend
              policyTypes:
                - Ingress
              ingress:
                - from:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: glueops-core
                      podSelector:
                        matchLabels:
                          app.kubernetes.io/name: argocd-server
                  ports:
                    - protocol: TCP
                      port: 8000
          # Cluster-scoped: the backend resolves Applications by name across
          # namespaces, and the destination namespace is not known ahead of time.
          - |-
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: glueops-core-argocd-extension-backend-applications
            rules:
              - apiGroups: ["argoproj.io"]
                resources: ["applications"]
                verbs: ["get"]
          - |-
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: glueops-core-argocd-extension-backend-applications
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: glueops-core-argocd-extension-backend-applications
            subjects:
              - kind: ServiceAccount
                name: argocd-extension-backend-api
                namespace: glueops-core-argocd-extension-backend
          # Cluster-scoped rather than a Role in $env: that namespace is owned by
          # captain-manifests and often does not exist when this app first syncs,
          # and the backend serves whatever namespace an Application deploys to,
          # which is not always $env. Reads are gated by ALLOWED_DEST_NAMESPACES
          # in the backend.
          #
          # pods:list is deliberately NOT granted: v0.1.4 never lists pods. Add it
          # back when bumping to a release whose var-pod resolution needs it.
          - |-
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: glueops-core-argocd-extension-backend-workloads
            rules:
              - apiGroups: ["apps"]
                resources: ["deployments", "statefulsets", "daemonsets"]
                verbs: ["list"]
              - apiGroups: ["external-secrets.io"]
                resources: ["externalsecrets"]
                verbs: ["list"]
          - |-
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: glueops-core-argocd-extension-backend-workloads
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: glueops-core-argocd-extension-backend-workloads
            subjects:
              - kind: ServiceAccount
                name: argocd-extension-backend-api
                namespace: glueops-core-argocd-extension-backend
