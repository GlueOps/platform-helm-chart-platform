apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glueops-core-traefik-crds-and-middleware
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: glueops-core
  destination:
    name: in-cluster
    # this Application only carries the oauth2 Middlewares now (the traefik CRDs come from the platform-crds bundle);
    # the destination namespace is irrelevant for them, each Middleware sets its own namespace
    namespace: glueops-core-traefik-crds

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # Prune stays OFF: Argo CD never tracked the CRDs this Application used to
      # render, so nothing is pruned when they disappear from the rendered set.
      - Prune=false
    automated:
      prune: false
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m0s
      limit: 5

  sources:
    # The traefik.io CRDs are NOT rendered here anymore: they are installed by
    # captain_utils from the platform-crds layer-0 bundle (GlueOps/platform-crds).
    #
    # A Helm source that supports extraObjects
    #
    # Best place for these middlewares is usually your *existing Traefik helm release app*.
    # If you already have the Traefik chart installed elsewhere, move the extraObjects block
    # into that Traefik app’s values instead of creating a second Traefik release here.
    - repoURL: https://helm.gpkg.io/project-template
      chart: app
      targetRevision: 0.14.1
      helm:
        values: |
          appName: '{{ .Release.Name }}'

          customResources:
            - |-
              apiVersion: v1
              kind: Namespace
              metadata:
                name: glueops-core-platform-traefik
                annotations:
                  argocd.argoproj.io/sync-wave: "0"

            - |-
              apiVersion: v1
              kind: Namespace
              metadata:
                name: glueops-core-public-traefik
                annotations:
                  argocd.argoproj.io/sync-wave: "0"

            - |-
              apiVersion: v1
              kind: Namespace
              metadata:
                name: glueops-core-internal-traefik
                annotations:
                  argocd.argoproj.io/sync-wave: "0"

            - |-
              apiVersion: traefik.io/v1alpha1
              kind: Middleware
              metadata:
                name: oauth2-ssl-redirect
                namespace: glueops-core-oauth2-proxy
                annotations:
                  argocd.argoproj.io/sync-wave: "1"
              spec:
                redirectScheme:
                  scheme: https
                  permanent: true

            - |-
              apiVersion: traefik.io/v1alpha1
              kind: Middleware
              metadata:
                name: oauth2-forwardauth
                namespace: glueops-core-oauth2-proxy
                annotations:
                  # leaf: must exist before the wave-2 chains that reference it
                  argocd.argoproj.io/sync-wave: "1"
              spec:
                forwardAuth:
                  address: https://oauth2.{{ .Values.captain_domain }}/oauth2/auth
                  trustForwardHeader: true
                  authResponseHeaders:
                    - authorization
                    - x-auth-request-user
                    - x-auth-request-email
                    - x-auth-request-access-token

            - |-
              apiVersion: traefik.io/v1alpha1
              kind: Middleware
              metadata:
                name: oauth2-errors-redirect
                namespace: glueops-core-oauth2-proxy
                annotations:
                  argocd.argoproj.io/sync-wave: "1"
              spec:
                plugin:
                  redirectErrors:
                    status: ["401-403"]
                    target: "https://oauth2.{{ .Values.captain_domain }}/oauth2/start?rd={url}"

            - |-
              apiVersion: traefik.io/v1alpha1
              kind: Middleware
              metadata:
                name: oauth2-with-redirect
                namespace: glueops-core-oauth2-proxy
                annotations:
                  # apply after the two middlewares it references
                  argocd.argoproj.io/sync-wave: "2"
              spec:
                chain:
                  middlewares:
                    - name: oauth2-ssl-redirect
                    - name: oauth2-errors-redirect
                    - name: oauth2-forwardauth

            - |-
              apiVersion: traefik.io/v1alpha1
              kind: Middleware
              metadata:
                name: oauth2-no-redirect
                namespace: glueops-core-oauth2-proxy
                annotations:
                  # apply after the two middlewares it references
                  argocd.argoproj.io/sync-wave: "2"
              spec:
                chain:
                  middlewares:
                    - name: oauth2-ssl-redirect
                    - name: oauth2-forwardauth

            # Same authentication as oauth2-forwardauth, but it does not list "authorization"
            # in authResponseHeaders. Traefik applies that list as an unconditional
            # `req.Header.Del(name)` followed by a re-add only if the auth server returned the
            # header; oauth2-proxy never returns one (set_authorization_header is off), so
            # listing it silently strips the caller's own bearer token before the backend sees
            # it. Backends that authenticate the caller themselves (ArgoCD) need it preserved.
            - |-
              apiVersion: traefik.io/v1alpha1
              kind: Middleware
              metadata:
                name: oauth2-forwardauth-bearer
                namespace: glueops-core-oauth2-proxy
                annotations:
                  # leaf: must exist before the wave-2 chains that reference it
                  argocd.argoproj.io/sync-wave: "1"
              spec:
                forwardAuth:
                  address: https://oauth2.{{ .Values.captain_domain }}/oauth2/auth
                  trustForwardHeader: true
                  authResponseHeaders:
                    - x-auth-request-user
                    - x-auth-request-email
                    - x-auth-request-access-token

            # For API/gRPC routes: still fully authenticated at the edge, but returns 401
            # rather than a login redirect and leaves the caller's bearer token intact.
            - |-
              apiVersion: traefik.io/v1alpha1
              kind: Middleware
              metadata:
                name: oauth2-api
                namespace: glueops-core-oauth2-proxy
                annotations:
                  # apply after the two middlewares it references
                  argocd.argoproj.io/sync-wave: "2"
              spec:
                chain:
                  middlewares:
                    - name: oauth2-ssl-redirect
                    - name: oauth2-forwardauth-bearer

            # For a host that serves a browser UI *and* an API on the same routes (ArgoCD
            # serves gRPC-web at root paths like /version.VersionService/Version, which the
            # "/" ingress matches). Redirects an unauthenticated browser to login as
            # oauth2-with-redirect does, but leaves a CLI's bearer token intact. Browsers
            # never send Authorization — they use the backend's own session cookie — so
            # preserving it costs the UI nothing.
            - |-
              apiVersion: traefik.io/v1alpha1
              kind: Middleware
              metadata:
                name: oauth2-with-redirect-bearer
                namespace: glueops-core-oauth2-proxy
                annotations:
                  # apply after the three middlewares it references
                  argocd.argoproj.io/sync-wave: "2"
              spec:
                chain:
                  middlewares:
                    - name: oauth2-ssl-redirect
                    - name: oauth2-errors-redirect
                    - name: oauth2-forwardauth-bearer
