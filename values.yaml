# Object storage for the monitoring stack (GlueOps/k8s-monitoring-helm). The three `storage` blocks are the
# `loki_storage` / `thanos_storage` / `tempo_storage` inputs of terraform-module-cloud-multy-prerequisites, passed
# through verbatim to the loki (`loki.storage`), kube-prometheus-stack/thanos (`objstoreConfig`) and tempo-distributed
# (`storage.trace`) charts. main.tf normalises each value with indent(4, yamlencode(yamldecode(...))), so any valid
# YAML at any indentation is re-based onto the placeholder line below.
loki:
  # -- https://grafana.com/docs/loki/latest/configure/#storage_config — `bucketNames`, `type: s3`, `s3: {...}`
  storage:
    #placeholder_loki_storage: {}
  # -- memcached chunk cache sizing. https://docs.memcached.org/advisories/grafanaloki/ and
  # https://grafana.com/blog/2023/08/23/how-we-scaled-grafana-cloud-logs-memcached-cluster-to-50tb-and-improved-reliability/
  chunkConfig:
    replicas: 2
    maxItemMemory: 2
    allocatedMemory: 2024
    batchSize: 2
    parallelism: 2
    writebackParallelism: 1
    writebackBuffer: 1000
    writebackSizeLimit: 500MB

thanos:
  # -- https://thanos.io/tip/thanos/storage.md/ — `type: s3`, `config: {bucket, endpoint, access_key, secret_key}`
  storage:
    #placeholder_thanos_storage: {}

tempo:
  # -- https://grafana.com/docs/tempo/latest/configuration/#storage — `backend: s3`, `s3: {...}`
  storage:
    #placeholder_tempo_storage: {}
  # -- how long the compactor keeps trace blocks
  compaction_block_retention: "168h"

prometheus:
  # -- Volume of storage requested for each Prometheus PVC, in Gi (2 replicas). Retention is short (1d / 10GB);
  # long-term metrics live in Thanos object storage.
  volume_claim_storage_request: "50"

vault:
  # -- Volume of storage requested for each Vault Data PVC, in Gi
  data_storage: placeholder_vault_data_storage

nginx:
  # -- number of replicas for ingress controller
  controller_replica_count: placeholder_nginx_controller_replica_count
  public_lb:
    enabled: placeholder_nginx_enable_public_lb

traefik:
  # -- number of replicas for traefik controller
  internal_lb:
    enabled: placeholder_traefik_enable_internal_lb
    deployment_replicas: placeholder_traefik_internal_lb_deployment_replicas
  public_lb:
    enabled: placeholder_traefik_enable_public_lb
    deployment_replicas: placeholder_traefik_public_lb_deployment_replicas
  platform_lb:
    deployment_replicas: 2
  shared_helm_values:
    experimental:
      plugins:
        redirectErrors:
          moduleName: github.com/indivisible/redirecterrors
          version: "v0.1.0"
    image:
      registry: dockerhub.repo.gpkg.io
      repository: traefik
      tag: v3.6.7@sha256:a9890c898f379c1905ee5b28342f6b408dc863f08db2dab20e46c267d1ff463a
    resources:
      requests:
        cpu: 100m
        memory: 90Mi
    logs:
      access:
        enabled: true
        format: json
      general:
        format: json
        level: INFO
    metrics:
      prometheus:
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        service:
          enabled: true
        serviceMonitor:
          enabled: true
    additionalArguments:
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--serversTransport.insecureSkipVerify=true"

    tlsStore:
      default:
        defaultCertificate:
          secretName: default-ingress-cert

    api:
      dashboard: true

    ports:
      traefik:
        expose:
          default: true

      web:
        expose:
          default: true
        exposedPort: 80
        forwardedHeaders:
          insecure: true
        transport:
          lifeCycle:
            requestAcceptGraceTimeout: 240s
            graceTimeOut: 240s

      websecure:
        expose:
          default: true
        exposedPort: 443
        forwardedHeaders:
          insecure: true
        transport:
          lifeCycle:
            requestAcceptGraceTimeout: 240s
            graceTimeOut: 240s
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - traefik


