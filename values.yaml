        registry: ghcr.repo.gpkg.io
        repository: glueops/gluekube-ccm
        tag: v0.43.0@sha256:7d6a5d89665d31b26122376b33e89dde79626f244c0688e2a7cf858e917a4feb

enable_chisel_proxy_protocol: false

kubeadm:
  # LOAD-BEARING: leave this unquoted. terraform substitutes a bare true/false, which must render as a YAML boolean.
  # captain_utils passes this file to the platform-crds bundle to pick which CRD profiles a cluster installs, and that
  # chart's values.schema.json requires a boolean — quoting it renders "true", which this chart still accepts as truthy
  # but which hard-fails the `crds` step on every kubeadm cluster with: at '/kubeadm/enabled': got string, want boolean.
  enabled: placeholder_enable_kubeadm_cluster
  kube_etcd:
    serviceMonitor:
      caFile: /etc/prometheus/secrets/etcd-client-certs/ca.crt
      certFile: /etc/prometheus/secrets/etcd-client-certs/apiserver-etcd-client.crt
      keyFile: /etc/prometheus/secrets/etcd-client-certs/apiserver-etcd-client.key
